packages:
  - '.'
  - 'crates/*'
  - 'website'
  - 'website/vendor/*'

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - '@emnapi/*'
  - '@napi-rs/*'
  - '@oxc-node/*'
  - '@oxlint/*'
  - '@tailwindcss/*'
  - '@void/*'
  - emnapi
  - oxlint
  - tailwindcss
  - typescript
  - void

forceIgnoresPlatform: true

# These packages use their platform binaries without running install scripts.
allowBuilds:
  esbuild: false
  workerd: false
